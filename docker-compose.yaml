name: ${COMPOSE_PROJECT_NAME:-tf-mark1}

services:
  ministack:
    image: ${MINISTACK_IMAGE:-ministackorg/ministack:1.5.3}
    ports:
      - "127.0.0.1:${MINISTACK_PORT:-4566}:4566"
    environment:
      GATEWAY_PORT: "4566"
      LOG_LEVEL: ${MINISTACK_LOG_LEVEL:-INFO}
      MINISTACK_HOST: localhost
      MINISTACK_REGION: ${AWS_REGION:-ap-northeast-1}
      MINISTACK_ACCOUNT_ID: ${AWS_ACCOUNT_ID:-000000000000}
      PERSIST_STATE: ${MINISTACK_PERSIST_STATE:-1}
      STATE_DIR: /data/state
      S3_PERSIST: ${MINISTACK_S3_PERSIST:-1}
      S3_DATA_DIR: /data/s3
      RDS_PERSIST: ${MINISTACK_RDS_PERSIST:-0}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      LAMBDA_EXECUTOR: ${MINISTACK_LAMBDA_EXECUTOR:-docker}
      DOCKER_NETWORK: ${COMPOSE_PROJECT_NAME:-tf-mark1}_ministack
    volumes:
      - ministack-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - ministack

  stackport:
    image: ${STACKPORT_IMAGE:-davireis/stackport:0.3.8}
    ports:
      - "127.0.0.1:${STACKPORT_PORT:-8080}:8080"
    environment:
      AWS_ENDPOINT_URL: http://ministack:4566
      AWS_REGION: ${AWS_REGION:-ap-northeast-1}
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      STACKPORT_ALLOW_WRITES: "${STACKPORT_ALLOW_WRITES:-false}"
      STACKPORT_DATA_DIR: /data
    volumes:
      - stackport-data:/data
    depends_on:
      ministack:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - ministack

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - ministack

volumes:
  ministack-data:
  stackport-data:

networks:
  ministack:
    name: ${COMPOSE_PROJECT_NAME:-tf-mark1}_ministack
